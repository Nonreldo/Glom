<title>Glom - Galéria</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;

    background:
    linear-gradient(
    135deg,
    #161616 0%,
    #1d2235 35%,
    #2a1f3f 70%,
    #1d2d24 100%
    );

    background-attachment:fixed;

    color:white;

    overflow-x:hidden;
}

nav{
    position:fixed;
    top:0;
    width:100%;
    height:90px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 25px;

    background:linear-gradient(90deg,#667eea,#764ba2,#55a34b);
    background-size:300% 300%;
    animation:gradientMove 8s infinite;

    z-index:1000;

    box-shadow:0 5px 15px rgba(0,0,0,0.5);
}
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.logo img{
    height: 140px;
    width: auto;
    object-fit: contain;
    transition: 0.3s ease;
}

.logo img:hover{
    transform: scale(1.05) rotate(-2deg);
}

nav ul{
    display:flex;
    gap:25px;
    list-style:none;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:#00ffff;
}

/* ===================== */
/* HERO */
/* ===================== */

header{
    height:75vh;
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* PRECHÁDZAJÚCE OBRÁZKY */

.hero-slide{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    animation:heroFade 24s infinite;
}

.hero-slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
}

.hero-slide:nth-child(1){
    background-image:url('https://images.pexels.com/photos/546819/pexels-photo-546819.jpeg');
    animation-delay:0s;
}

.hero-slide:nth-child(2){
    background-image:url('https://images.pexels.com/photos/1181675/pexels-photo-1181675.jpeg');
    animation-delay:6s;
}

.hero-slide:nth-child(3){
    background-image:url('https://images.pexels.com/photos/177598/pexels-photo-177598.jpeg');
    animation-delay:12s;
}

.hero-slide:nth-child(4){
    background-image:url('https://images.pexels.com/photos/373543/pexels-photo-373543.jpeg');
    animation-delay:18s;
}

@keyframes heroFade{

    0%{opacity:0;}
    8%{opacity:1;}
    25%{opacity:1;}
    33%{opacity:0;}
    100%{opacity:0;}

}

/* NADPIS GALÉRIA */

.hero-title{
    position:relative;
    z-index:5;
}

.hero-title h1{
    font-size:90px;
    text-shadow:5px 5px 15px black;
}

/* ===================== */
/* GALÉRIA */
/* ===================== */

.gallery{
    padding:120px 20px 80px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.gallery a{
    display:block;
    overflow:hidden;
    border-radius:14px;
    box-shadow:0 5px 18px rgba(0,0,0,0.45);
}

.gallery img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    transition:
    transform 0.55s ease,
    filter 0.55s ease;
}

/* HOVER */

.gallery a:hover img{

    transform:scale(1.18);

    filter:
    brightness(1.15)
    contrast(1.08)
    saturate(1.15);

}

/* ===================== */
/* FADE */
/* ===================== */

.fade{
    opacity:0;
    transform:translateY(45px);
    animation:fadeIn 1s forwards;
    animation-timeline:view();
    animation-range:entry 10%;
}

@keyframes fadeIn{

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ===================== */
/* LIGHTBOX */
/* ===================== */

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.93);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox:target{
    display:flex;
}

/* KLIK MIMO OBRÁZKA */

.lightbox .bg-close{
    position:absolute;
    inset:0;
}

/* OBRÁZOK */

.lightbox img{
    max-width:90vw;
    max-height:90vh;
    border-radius:14px;
    z-index:3;
}

/* ŠÍPKY */

.nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:70px;
    color:white;
    text-decoration:none;
    z-index:4;
    padding:20px;
    user-select:none;
}

.prev{ left:20px; }
.next{ right:20px; }

/* X */

.close{
    position:absolute;
    top:20px;
    right:35px;
    font-size:60px;
    color:white;
    text-decoration:none;
    z-index:4;
}

/* ===================== */
/* CONTACT */
/* ===================== */

.contact{

    background:#2a2a2a;

    padding:90px 30px;
}

.contact h2{

    text-align:center;

    margin-bottom:40px;

    font-size:45px;

    color:#a7c8ff;
}

.contact form{

    max-width:700px;

    margin:auto;

    display:flex;

    flex-direction:column;

    gap:20px;
}

.contact input,
.contact textarea{

    padding:16px;

    border:none;

    border-radius:10px;

    font-size:16px;
}

.contact button{

    padding:16px;

    border:none;

    background:#667eea;

    color:white;

    border-radius:10px;

    cursor:pointer;

    font-size:18px;

    transition:0.3s;
}

.contact button:hover{

    background:#55a34b;
}

/* ===================== */
/* FOOTER */
/* ===================== */

footer{

    text-align:center;

    padding:30px;

    background:#111;
}

/* ===================== */
/* RESPONSIVE */
/* ===================== */

@media(max-width:1000px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

    .hero-title h1{
        font-size:60px;
    }

}

@media(max-width:768px){

    nav{
        height:auto;
        padding:15px;
        flex-direction:column;
        align-items:center;
        gap:10px;
    }

    .logo img{
        height:45px;
    }

    nav ul{
        flex-direction:row;
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    .hero-text h1{
        font-size:50px;
    }

    .hero-text p{
        font-size:18px;
    }

    .section{
        padding:80px 20px;
    }

}

</style>
